name: EvalBench CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install EvalBench
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run test suite
        run: pytest -q
