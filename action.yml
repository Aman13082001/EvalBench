name: "EvalBench LLM Eval"
description: "Run an EvalBench suite against a running API and fail the job below a pass-rate gate"
author: "Aman Kumar Sharma"

inputs:
  suite-path:
    description: "Path to the evaluation suite YAML"
    required: true
    default: "suites/ci-suite.yaml"

  model:
    description: "Ollama model to test"
    required: true
    default: "llama3.1"

  threshold:
    description: "Minimum pass rate before the job fails (0-1)"
    required: true
    default: "0.75"

  api-url:
    description: "EvalBench API URL"
    required: true
    default: "http://localhost:8000"

  api-key:
    description: "API key for authentication (do not hard-code — pass a secret)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install EvalBench
      shell: bash
      run: pip install evalbench

    - name: Run evaluation
      shell: bash
      env:
        EVALBENCH_API_URL: ${{ inputs.api-url }}
      run: >
        evalbench run ${{ inputs.suite-path }}
        --model ${{ inputs.model }}
        --fail-under ${{ inputs.threshold }}
        --api-key ${{ inputs.api-key }}
