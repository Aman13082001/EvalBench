services:
  mongo:
    image: mongo:7
    container_name: evalbench-mongo
    restart: unless-stopped
    # Loopback only: the browser never talks to Mongo, the containers
    # reach it over the compose network, and `mongosh` from the host
    # still works. Published on every interface, a copy of this file on
    # a VPS puts the user table on the internet with no password.
    # 27018 on the host, because a MongoDB installed natively owns
    # 27017 on many machines — and then the host CLI edits the wrong
    # database without anyone noticing. Inside the network it is 27017.
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-evalbench}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - evalbench-net

  ollama:
    image: ollama/ollama:latest
    container_name: evalbench-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - evalbench-net

  redis:
    image: redis:7-alpine
    container_name: evalbench-redis
    restart: unless-stopped
    # Same as Mongo: nothing outside this machine has business here, and
    # a caller's provider key sits in this Redis between submit and run.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evalbench-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evalbench-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-evalbench}
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
      JOB_BACKEND: ${JOB_BACKEND:-rq}
      # Hosted providers (optional) — read from .env / the shell.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-32-char-string}
      # Local dev boots with placeholder secrets. Remove this (and set real
      # SECRET_KEY / ADMIN_* in .env) before deploying anywhere real.
      EVALBENCH_ALLOW_INSECURE: "1"
      TOKEN_EXPIRE_MINUTES: ${TOKEN_EXPIRE_MINUTES:-10080}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-in-production}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-eb_admin_change_me_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3005}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mongo:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - evalbench-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # No container_name — scale with `docker compose up -d --scale worker=N`.
    restart: unless-stopped
    command: ["python", "-m", "evalbench.worker"]
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-evalbench}
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
      JOB_BACKEND: rq
      WORKER_METRICS_PORT: 9100
      EVALBENCH_ALLOW_INSECURE: "1"
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-32-char-string}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-eb_admin_change_me_in_production}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evalbench-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: evalbench-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - evalbench-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: evalbench-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # From .env. The shipped default is for a laptop; a deployment
      # sets GRAFANA_ADMIN_PASSWORD or hands out its dashboards' admin.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-evalbench}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Let the web app embed panels at /dashboard. Anonymous viewing is
      # scoped to the Viewer role and is for local dev — put Grafana
      # behind your own auth before exposing it.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - evalbench-net

  # The website. Was missing entirely: when the Streamlit UI was removed
  # its compose service went with it, and the Next.js app that replaced
  # it was never containerized — so `docker compose up` brought up the
  # whole backend and no front end.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time, and used by the
        # visitor's BROWSER — so it must be the published host address,
        # not the in-network "http://api:8000".
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL:-http://localhost:3000}
    container_name: evalbench-web
    restart: unless-stopped
    ports:
      - "3005:3005"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: in this image localhost resolves to
      # ::1 first and the Next server binds IPv4 only, so the check
      # would fail against a perfectly healthy site.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3005/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - evalbench-net

volumes:
  mongo_data:
  ollama_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  evalbench-net:
    driver: bridge
