version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: evalbench-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: evalbench
    volumes:
      - mongo_data:/data/db
    networks:
      - evalbench-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evalbench-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=evalbench
    depends_on:
      - mongo
    networks:
      - evalbench-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: evalbench-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - EVALBENCH_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - evalbench-net

  # ── Day 12: Prometheus + Grafana ──
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: evalbench-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - evalbench-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: evalbench-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=evalbench
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - evalbench-net

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:

networks:
  evalbench-net:
    driver: bridge