[project]
name = "evalbench"
version = "0.5.0"
description = "LLM evaluation with real statistics: regression gates, safety in both directions, and a measurement of what the measurement can see"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aman Kumar Sharma" }]
keywords = ["llm", "evaluation", "regression-testing", "ollama", "prometheus", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.5.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "sentence-transformers>=3.0.0",
    "scipy>=1.13.0",
    "jsonschema>=4.20.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "PyJWT>=2.10.0",
    # runkeys.py: a caller's provider key is Fernet-encrypted while it
    # waits in Redis. Was a side effect of python-jose[cryptography].
    "cryptography>=42.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<5.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "rq>=1.16.0",
    # Imported directly, so declared directly — not left to arrive as
    # someone else's dependency. tests/test_hardening.py checks this.
    "pymongo>=4.7",             # bson, DuplicateKeyError (motor brings it, we use it)
    "redis>=5.0",               # jobs_rq.py, runkeys.py (rq brings it, we use it)
    "prometheus-client>=0.20",  # metrics.py (the instrumentator brings it)
    "anyio>=4.0",               # core/endpoint.py: the pinned network backend
    "httpcore>=1.0",            # core/endpoint.py: the guarded transport
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mongomock-motor>=0.0.30",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Repository = "https://github.com/Aman13082001/EvalBench"

[project.scripts]
evalbench = "evalbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalbench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F  - pyflakes + pycodestyle errors (real bugs, undefined names, ...)
# I    - import sorting
# UP   - pyupgrade (modern syntax: `X | None`, `list[...]`, ...)
# B    - flake8-bugbear (likely bugs)
select = ["E", "F", "I", "UP", "B"]
# B008  - FastAPI `Depends()` / Typer `Option()` in defaults is the framework idiom
# BLE001 - evaluators/runner deliberately catch `Exception` so one bad test
#          never aborts a whole run
# E501  - line length is advisory, not enforced
ignore = ["B008", "BLE001", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
