[project]
name = "evalbench"
version = "0.1.0"
description = "Local LLM evaluation, regression testing, and safety monitoring platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aman Kumar Sharma" }]
keywords = ["llm", "evaluation", "regression-testing", "ollama", "prometheus", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.5.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "sentence-transformers>=3.0.0",
    "scipy>=1.13.0",
    "jsonschema>=4.20.0",
    "streamlit>=1.37.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<5.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Repository = "https://github.com/Aman13082001/EvalBench"

[project.scripts]
evalbench = "evalbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalbench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F  - pyflakes + pycodestyle errors (real bugs, undefined names, ...)
# I    - import sorting
# UP   - pyupgrade (modern syntax: `X | None`, `list[...]`, ...)
# B    - flake8-bugbear (likely bugs)
select = ["E", "F", "I", "UP", "B"]
# B008  - FastAPI `Depends()` / Typer `Option()` in defaults is the framework idiom
# BLE001 - evaluators/runner deliberately catch `Exception` so one bad test
#          never aborts a whole run
# E501  - line length is advisory, not enforced
ignore = ["B008", "BLE001", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
