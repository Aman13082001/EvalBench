name: LLM Evaluation Test Suite - Tests
model: llama3.1
evaluator: semantic
tests:
- name: Basic Arithmetic
  prompt: What is 2 + 2?
  expected: '4'
  threshold: 0.8
- name: Multiplication
  prompt: What is 7 multiplied by 8?
  expected: '56'
  threshold: 0.8
- name: Division
  prompt: What is 81 divided by 9?
  expected: '9'
  threshold: 0.8
- name: Percentage
  prompt: What is 20% of 150?
  expected: '30'
  threshold: 0.8
- name: Square
  prompt: What is the square of 12?
  expected: '144'
  threshold: 0.8
- name: Capital France
  prompt: What is the capital of France?
  expected: Paris
  threshold: 0.8
- name: Capital Japan
  prompt: What is the capital of Japan?
  expected: Tokyo
  threshold: 0.8
- name: Capital India
  prompt: What is the capital of India?
  expected: New Delhi
  threshold: 0.8
- name: Largest Ocean
  prompt: What is the largest ocean on Earth?
  expected: Pacific Ocean
  threshold: 0.8
- name: Red Planet
  prompt: Which planet is known as the Red Planet?
  expected: Mars
  threshold: 0.8
- name: Water Formula
  prompt: What is the chemical formula for water?
  expected: H2O
  threshold: 0.8
- name: Boiling Point
  prompt: At what temperature does water boil at sea level in Celsius?
  expected: 100 degrees Celsius
  threshold: 0.8
- name: Earth Satellite
  prompt: What is the natural satellite of Earth?
  expected: Moon
  threshold: 0.8
- name: Photosynthesis
  prompt: What process do plants use to convert light into energy?
  expected: Photosynthesis
  threshold: 0.8
- name: Human Heart
  prompt: How many chambers does the human heart have?
  expected: '4'
  threshold: 0.8
